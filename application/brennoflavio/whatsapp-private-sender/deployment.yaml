apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-private-sender
  namespace: whatsapp-private-sender
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-private-sender
  template:
    metadata:
      labels:
        app: whatsapp-private-sender
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whatsapp-private-sender
          image: registry.home.brennoflavio.com.br/apps/whatsapp-private-sender:master-6714eac-1793921993 # {"$imagepolicy": "whatsapp-private-sender:whatsapp-private-sender"}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: whatsapp-private-sender
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whatsapp-private-sender
