apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: whatsapp-private-sender
  namespace: whatsapp-private-sender
spec:
  imageRepositoryRef:
    name: whatsapp-private-sender
  filterTags:
    pattern: '^master-[0-9a-f]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
