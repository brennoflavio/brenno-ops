apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-private-sender
  namespace: whatsapp-private-sender
  annotations:
    volume.kubernetes.io/selected-node: brenno-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
