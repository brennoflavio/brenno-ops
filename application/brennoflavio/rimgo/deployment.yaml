---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rimgo
  namespace: rimgo
  labels:
    app: rimgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rimgo
  template:
    metadata:
      labels:
        app: rimgo
    spec:
      containers:
      - name: rimgo
        image: codeberg.org/rimgo/rimgo:2.0-rc.3
        ports:
        - containerPort: 3000
        env:
        - name: ADDR
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        - name: IMGUR_CLIENT_ID
          value: 546c25a59c58ad7
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 64Mi
