apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goatcounter
  namespace: goatcounter
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
    external-dns.alpha.kubernetes.io/target: "brennoflavio.com.br"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: external-nginx
  rules:
    - host: goatcounter.brennoflavio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goatcounter
                port:
                  name: http
  tls:
    - hosts:
        - goatcounter.brennoflavio.com.br
      secretName: goatcounter-tls
