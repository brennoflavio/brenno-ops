apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent
  namespace: coding-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coding-agent
  template:
    metadata:
      labels:
        app: coding-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: prepare-agent-runtime
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /git-ssh /git-http /agent-config
              cp /source/id_ed25519 /git-ssh/id_ed25519
              cp /source/known_hosts /git-ssh/known_hosts
              cp /git-http-source/credentials /git-http/credentials
              cp /agent-config-source/coding-agent-config.json /agent-config/coding-agent-config.json
              cat > /git-http/credential-helper <<'EOF'
              #!/bin/sh
              if [ "$1" = get ]; then
                exec git credential-store --file=/run/git-http/credentials get
              fi
              EOF
              cat > /git-ssh/config <<'EOF'
              Host git.brennoflavio.com.br
                HostName git.brennoflavio.com.br
                Port 2222
                User git
                IdentityFile /run/git-ssh/id_ed25519
                IdentitiesOnly yes
                UserKnownHostsFile /run/git-ssh/known_hosts
                StrictHostKeyChecking yes
              EOF
              chown -R 1000:1000 /git-ssh /git-http /agent-config
              chmod 0700 /git-ssh /git-http /agent-config
              chmod 0600 /git-ssh/id_ed25519 /git-ssh/config /git-http/credentials /agent-config/coding-agent-config.json
              chmod 0700 /git-http/credential-helper
              chmod 0644 /git-ssh/known_hosts
          volumeMounts:
            - name: forgejo-git-source
              mountPath: /source
              readOnly: true
            - name: forgejo-git
              mountPath: /git-ssh
            - name: coding-agent-config-source
              mountPath: /agent-config-source
              readOnly: true
            - name: coding-agent-config
              mountPath: /agent-config
            - name: forgejo-git-http-source
              mountPath: /git-http-source
              readOnly: true
            - name: forgejo-git-http
              mountPath: /git-http
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 16Mi
      containers:
        - name: coding-agent
          image: git.brennoflavio.com.br/brennoflavio/coding-agent:main-ec7bc8f-1790967696 # {"$imagepolicy": "coding-agent:coding-agent"}
          imagePullPolicy: IfNotPresent
          workingDir: /home/pi
          env:
            - name: HOME
              value: /home/pi
            - name: PI_ENVIRONMENT
              value: docker
            - name: PI_DATA_DIR
              value: /data
            - name: PI_CODING_AGENT_DIR
              value: /home/pi/.pi/agent
            - name: PI_SETTINGS_DEFAULT_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: PI_SETTINGS_DEFAULT_PROVIDER
                  optional: true
            - name: PI_SETTINGS_DEFAULT_MODEL
              valueFrom:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: PI_SETTINGS_DEFAULT_MODEL
                  optional: true
            - name: PI_SETTINGS_DEFAULT_THINKING_LEVEL
              valueFrom:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: PI_SETTINGS_DEFAULT_THINKING_LEVEL
                  optional: true
            - name: PI_TELEGRAM_CONFIG
              valueFrom:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: PI_TELEGRAM_CONFIG
            - name: XDG_CACHE_HOME
              value: /data/cache
            - name: PLAYWRIGHT_CLI_CONFIG
              value: /data/playwright-cli/config.json
            - name: TZ
              value: America/Sao_Paulo
            - name: GIT_SSH_COMMAND
              value: ssh -F /run/git-ssh/config
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: credential.helper
            - name: GIT_CONFIG_VALUE_0
              value: ""
            - name: GIT_CONFIG_KEY_1
              value: credential.helper
            - name: GIT_CONFIG_VALUE_1
              value: '!/run/git-http/credential-helper'
            - name: PI_SECRETS
              valueFrom:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: PI_SECRETS
          resources:
            requests:
              cpu: 2000m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/pi
            - name: data
              mountPath: /data
            - name: state
              mountPath: /home/pi/.pi/agent
            - name: forgejo-git
              mountPath: /run/git-ssh
              readOnly: true
            - name: coding-agent-config
              mountPath: /home/pi/.pi/agent/coding-agent-config.json
              subPath: coding-agent-config.json
            - name: forgejo-git-http
              mountPath: /run/git-http
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: coding-agent-home
        - name: data
          persistentVolumeClaim:
            claimName: coding-agent-data
        - name: state
          persistentVolumeClaim:
            claimName: coding-agent-state
        - name: forgejo-git-source
          secret:
            secretName: coding-agent-secrets
            defaultMode: 256
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
        - name: forgejo-git
          emptyDir:
            medium: Memory
        - name: coding-agent-config-source
          secret:
            secretName: coding-agent-secrets
            defaultMode: 256
            items:
              - key: coding-agent-config.json
                path: coding-agent-config.json
        - name: coding-agent-config
          emptyDir:
            medium: Memory
        - name: forgejo-git-http-source
          secret:
            secretName: coding-agent-secrets
            defaultMode: 256
            items:
              - key: git-credentials
                path: credentials
        - name: forgejo-git-http
          emptyDir:
            medium: Memory
