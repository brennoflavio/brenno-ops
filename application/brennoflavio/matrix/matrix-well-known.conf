server {
  listen 80;
  server_name _;
  default_type application/json;

  location = /.well-known/matrix/server {
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"m.server":"matrix.brennoflavio.com.br:443"}';
  }

  location = /.well-known/matrix/client {
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"m.homeserver":{"base_url":"https://matrix.brennoflavio.com.br"}}';
  }
}
