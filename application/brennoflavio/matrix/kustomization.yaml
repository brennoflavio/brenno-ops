apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matrix
resources:
  - namespace.yaml
  - secret.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - admin-ingress.yaml
  - matrix-well-known-deployment.yaml
  - matrix-well-known-service.yaml
  - matrix-well-known-ingress.yaml
configMapGenerator:
  - name: matrix-well-known
    files:
      - default.conf=matrix-well-known.conf
