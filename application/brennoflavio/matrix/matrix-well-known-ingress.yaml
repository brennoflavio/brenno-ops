apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-well-known
  namespace: matrix
spec:
  ingressClassName: external-traefik
  rules:
    - host: brennoflavio.com.br
      http:
        paths:
          - path: /.well-known/matrix/server
            pathType: Exact
            backend:
              service:
                name: matrix-well-known
                port:
                  number: 80
          - path: /.well-known/matrix/client
            pathType: Exact
            backend:
              service:
                name: matrix-well-known
                port:
                  number: 80
