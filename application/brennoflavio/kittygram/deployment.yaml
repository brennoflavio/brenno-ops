apiVersion: apps/v1
kind: Deployment
metadata:
  name: kittygram
  namespace: kittygram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kittygram
  template:
    metadata:
      labels:
        app: kittygram
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kittygram
          image: git.brennoflavio.com.br/brennoflavio/kittygram:main-b1dd5b7-1793141490
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              value: kittygram-valkey.kittygram.svc.cluster.local
            - name: RESOLVER
              value: 10.43.0.10
            - name: BASE_ATOM_PATH
              value: https://kittygram.home.brennoflavio.com.br/
            - name: ENABLE_ATOM
              value: "true"
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: kittygram-secrets
                  key: secret
          startupProbe:
            tcpSocket:
              port: 80
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 80
          livenessProbe:
            tcpSocket:
              port: 80
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 128Mi
