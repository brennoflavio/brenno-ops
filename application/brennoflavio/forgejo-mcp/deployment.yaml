apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-mcp
  namespace: forgejo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-mcp
  template:
    metadata:
      labels:
        app: forgejo-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: forgejo-mcp
          image: git.b4mad.industries/agentic-forges/forgejo-mcp:v2.35.0
          args:
            - --transport
            - http
            - --url
            - https://git.brennoflavio.com.br
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
