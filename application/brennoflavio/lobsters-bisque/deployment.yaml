apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobsters-bisque
  namespace: lobsters-bisque
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobsters-bisque
  template:
    metadata:
      labels:
        app: lobsters-bisque
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lobsters-bisque
          image: git.brennoflavio.com.br/brennoflavio/lobsters-bisque:20260921042247 # {"$imagepolicy": "lobsters-bisque:lobsters-bisque"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
