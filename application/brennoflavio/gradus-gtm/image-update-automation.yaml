apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: gradus-gtm-coding-agent
  namespace: gradus-gtm
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: 'chore(gradus-gtm): update coding-agent image'
    push:
      branch: master
  update:
    path: ./application/brennoflavio/gradus-gtm
    strategy: Setters
