apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ladder
  namespace: ladder
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-dns01
spec:
  ingressClassName: internal-nginx
  rules:
    - host: ladder.home.brennoflavio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ladder
                port:
                  number: 8080
  tls:
    - hosts:
        - ladder.home.brennoflavio.com.br
      secretName: ladder-tls
