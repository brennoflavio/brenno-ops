apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rssbridge
  namespace: rssbridge
spec:
  releaseName: rssbridge
  chart:
    spec:
      chart: rss-bridge
      version: 0.5.2
      sourceRef:
        kind: HelmRepository
        name: rssbridge
        namespace: rssbridge
  interval: 30m
  install:
    remediation:
      retries: 3
  values:
    configMaps:
      php-security:
        enabled: true
        data:
          security.ini: |
            session.upload_progress.enabled=0
    persistence:
      php-security:
        enabled: true
        type: configMap
        name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-php-security'
        mountPath: /etc/php/8.2/fpm/conf.d/99-security.ini
        subPath: security.ini
        readOnly: true
    ingress:
      main:
        enabled: true
        ingressClassName: external-nginx
        annotations:
          cert-manager.io/cluster-issuer: lets-encrypt
          external-dns.alpha.kubernetes.io/target: "brennoflavio.com.br"
        hosts:
          - host: rssbridge.brennoflavio.com.br
            paths:
              - path: /
        tls:
          - secretName: rssbridge-tls
            hosts:
              - rssbridge.brennoflavio.com.br
    resources:
      limits:
        memory: 272Mi
      requests:
        cpu: 10m
        memory: 272Mi
