apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coding-agent-browser
  namespace: coding-agent-browser
spec:
  imageRepositoryRef:
    name: coding-agent-browser
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[1-9][0-9]*)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
