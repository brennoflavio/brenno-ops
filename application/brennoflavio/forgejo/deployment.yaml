---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.4
          envFrom:
            - secretRef:
                name: forgejo-secrets
          ports:
            - containerPort: 3000
            - containerPort: 2222
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__PATH
              value: /data/gitea/gitea.db
            - name: FORGEJO__server__DOMAIN
              value: git.brennoflavio.com.br
            - name: FORGEJO__server__ROOT_URL
              value: https://git.brennoflavio.com.br/
            - name: FORGEJO__server__DISABLE_SSH
              value: "false"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__server__SSH_DOMAIN
              value: git.brennoflavio.com.br
            - name: FORGEJO__server__SSH_PORT
              value: "2222"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.1
          env:
            - name: BIND
              value: :8923
            - name: TARGET
              value: http://localhost:3000
            - name: POLICY_FNAME
              value: /etc/anubis/bot-policy.yaml
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: forgejo-anubis
                  key: ED25519_PRIVATE_KEY_HEX
            - name: REDIRECT_DOMAINS
              value: git.brennoflavio.com.br
            - name: SERVE_ROBOTS_TXT
              value: "true"
          ports:
            - name: anubis
              containerPort: 8923
            - name: anubis-metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: anubis-metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: anubis-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: anubis-policy
              mountPath: /etc/anubis
              readOnly: true
            - name: anubis-data
              mountPath: /data
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo
        - name: anubis-policy
          configMap:
            name: forgejo-anubis
        - name: anubis-data
          emptyDir: {}
