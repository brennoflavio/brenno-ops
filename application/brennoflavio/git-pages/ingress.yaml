apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: git-pages
  namespace: git-pages
  annotations:
    external-dns.alpha.kubernetes.io/target: "brennoflavio.com.br"
    traefik.ingress.kubernetes.io/router.middlewares: git-pages_upload-limit@kubernetescrd
    # Treat Pages as the fallback; exact hosts must win over this wildcard.
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: external-traefik
  rules:
    - host: "*.brennoflavio.com.br"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git-pages
                port:
                  name: anubis
  tls:
    - hosts:
        - "*.brennoflavio.com.br"
      secretName: git-pages-tls
