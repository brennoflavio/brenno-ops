apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: git-pages-apex
  namespace: git-pages
  annotations:
    # Preserve the existing apex DNS record instead of deriving one from this Ingress.
    external-dns.alpha.kubernetes.io/controller: "ignore"
    traefik.ingress.kubernetes.io/router.middlewares: git-pages_upload-limit@kubernetescrd
spec:
  ingressClassName: external-traefik
  rules:
    - host: brennoflavio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git-pages
                port:
                  name: anubis
  tls:
    - hosts:
        - brennoflavio.com.br
      secretName: git-pages-tls
