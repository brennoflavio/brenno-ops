apiVersion: v1
kind: ConfigMap
metadata:
  name: git-pages
  namespace: git-pages
data:
  config.toml: |
    [server]
    pages = "tcp/:3000"
    proxy = "-"
    metrics = "tcp/:3002"
    https = "-"

    [storage]
    type = "fs"

    [storage.fs]
    root = "/data/sites"

    [[wildcard]]
    domain = "brennoflavio.com.br"
    clone-url = "https://git.brennoflavio.com.br/brennoflavio/<project>.git"
    index-repo = "<user>"
    index-repo-branch = "pages"
    authorization = "forgejo"

    [limits]
    allowed-repository-url-prefixes = ["https://git.brennoflavio.com.br/brennoflavio/"]
