controllers:
    main:
        containers:
            main:
                image:
                    tag: v3.0.3
                env:
                    REDIS_HOSTNAME: redis.immich.svc.cluster.local
                    REDIS_PORT: "6379"
                    DB_HOSTNAME: postgres.immich.svc.cluster.local
                    DB_USERNAME: postgres
                    DB_DATABASE_NAME: immich
                    IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
                resources:
                    requests:
                        memory: 2Gi
                        cpu: 1000m
                    limits:
                        memory: 8Gi
                        cpu: 8000m
immich:
    metrics:
        enabled: false
    persistence:
        library:
            existingClaim: immich
valkey:
    enabled: false
server:
    enabled: true
    controllers:
        main:
            containers:
                main:
                    image:
                        repository: ghcr.io/immich-app/immich-server
                        pullPolicy: IfNotPresent
    ingress:
        main:
            enabled: true
            className: external-nginx
            annotations:
                cert-manager.io/cluster-issuer: lets-encrypt
                nginx.ingress.kubernetes.io/proxy-body-size: "0"
                external-dns.alpha.kubernetes.io/target: brennoflavio.com.br
            hosts:
                - host: photos.brennoflavio.com.br
                  paths:
                    - path: /
                      service:
                        identifier: main
            tls:
                - hosts:
                    - photos.brennoflavio.com.br
                  secretName: immich-tls
machine-learning:
    enabled: true
    controllers:
        main:
            containers:
                main:
                    image:
                        repository: ghcr.io/immich-app/immich-machine-learning
                        pullPolicy: IfNotPresent
                    env:
                        TRANSFORMERS_CACHE: /cache
                        HF_XET_CACHE: /cache/huggingface-xet
                        MPLCONFIGDIR: /cache/matplotlib-config
    persistence:
        cache:
            enabled: true
            type: emptyDir
