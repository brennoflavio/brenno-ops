apiVersion: apps/v1
kind: Deployment
metadata:
  name: forma
  namespace: forma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forma
  template:
    metadata:
      labels:
        app: forma
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-db
          image: ghcr.io/dhruvcx-1/forma:v1.1.0
          command: ["/usr/local/bin/forma-backend", "--init-db"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: forma
          image: ghcr.io/dhruvcx-1/forma:v1.1.0
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: forma-secrets
                  key: COOKIE_SECRET
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forma-data
