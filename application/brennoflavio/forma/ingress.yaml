apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forma
  namespace: forma
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-dns01
spec:
  ingressClassName: internal-traefik
  rules:
    - host: forma.home.brennoflavio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forma
                port:
                  number: 80
  tls:
    - hosts:
        - forma.home.brennoflavio.com.br
      secretName: forma-tls
