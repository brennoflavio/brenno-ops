ingress:
    enabled: true
    className: external-nginx
    annotations:
        cert-manager.io/cluster-issuer: lets-encrypt
        external-dns.alpha.kubernetes.io/target: brennoflavio.com.br
        nginx.ingress.kubernetes.io/affinity: cookie
        nginx.ingress.kubernetes.io/server-snippet: |-
            server_tokens off;
            proxy_hide_header X-Powered-By;
            rewrite ^/.well-known/webfinger /index.php/.well-known/webfinger last;
            rewrite ^/.well-known/nodeinfo /index.php/.well-known/nodeinfo last;
            rewrite ^/.well-known/host-meta /public.php?service=host-meta last;
            rewrite ^/.well-known/host-meta.json /public.php?service=host-meta-json;
            location = /.well-known/carddav {
              return 301 $scheme://$host/remote.php/dav;
            }
            location = /.well-known/caldav {
              return 301 $scheme://$host/remote.php/dav;
            }
            location = /robots.txt {
              allow all;
              log_not_found off;
              access_log off;
            }
            location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
              deny all;
            }
            location ~ ^/(?:autotest|occ|issue|indie|db_|console) {
              deny all;
            }
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
    tls:
        - hosts:
            - nextcloud.brennoflavio.com.br
          secretName: nextcloud-ingress-tls
replicaCount: 1
nextcloud:
    host: nextcloud.brennoflavio.com.br
    username: brenno
    mail:
        enabled: true
        fromAddress: hello
        domain: nextcloud.brennoflavio.com.br
        smtp:
            host: email-smtp.sa-east-1.amazonaws.com
            secure: starttls
            port: 587
            authtype: LOGIN
    defaultConfigs:
        imaginary.config.php: true
        redis.config.php: false
    configs:
        previews.config.php: |-
            <?php
            $CONFIG = array (
              'enable_previews' => true,
              'enabledPreviewProviders' => array (
                'OC\Preview\Movie',
                'OC\Preview\PNG',
                'OC\Preview\JPEG',
                'OC\Preview\GIF',
                'OC\Preview\BMP',
                'OC\Preview\XBitmap',
                'OC\Preview\MP3',
                'OC\Preview\MP4',
                'OC\Preview\TXT',
                'OC\Preview\MarkDown',
                'OC\Preview\PDF',
                'OC\Preview\EMF',
                'OC\Preview\WEBP',
                'OC\Preview\RIFF'
              ),
            );
        redis.config.php: |-
            <?php
            $CONFIG = array(
                'memcache.distributed' => '\OC\Memcache\Redis',
                'memcache.locking' => '\OC\Memcache\Redis',
                'redis' => array(
                    'host' => 'redis.nextcloud.svc.cluster.local',
                    'port' => 6379,
                ),
            );
        maintenance.config.php: |-
            <?php
            $CONFIG = array (
              'maintenance_window_start' => 1
            );
        proxy.config.php: |-
            <?php
            $CONFIG = array (
                'trusted_proxies' => array(
                0 => '127.0.0.1',
                1 => '10.0.0.0/8',
                ),
                'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR')
            );
        logging.config.php: |-
            <?php
            $CONFIG = array (
                'syslog' => 'file',
                'syslog_tag' => 'Nextcloud',
                'loglevel' => 3
            );
        phone.config.php: |-
            <?php
            $CONFIG = array (
                'default_phone_region' => 'BR'
            );
        bruteforce.config.php: |-
            <?php
            $CONFIG = array (
                'auth.bruteforce.protection.enabled' => false
            );
persistence:
    enabled: true
    existingClaim: nextcloud
redis:
    enabled: false
cronjob:
    enabled: true
    resources:
        requests:
            memory: 512Mi
            cpu: 500m
        limits:
            memory: 1Gi
            cpu: 2000m
resources:
    requests:
        memory: 2Gi
        cpu: 1000m
    limits:
        memory: 4Gi
        cpu: 4000m
internalDatabase:
    enabled: false
mariadb:
    enabled: true
    image:
        registry: docker.io
        repository: bitnamilegacy/mariadb
    global:
        security:
            allowInsecureImages: true
    primary:
        persistence:
            enabled: true
            existingClaim: mariadb
        resources:
            requests:
                memory: 512Mi
                cpu: 200m
            limits:
                memory: 2Gi
                cpu: 800m
collabora:
    enabled: true
    replicaCount: 1
    collabora:
        extra_params: --o:ssl.enable=false --o:ssl.termination=true
    ingress:
        enabled: true
        className: external-nginx
        annotations:
            cert-manager.io/cluster-issuer: lets-encrypt
            external-dns.alpha.kubernetes.io/target: brennoflavio.com.br
        hosts:
            - host: libreoffice.brennoflavio.com.br
              paths:
                - path: /
                  pathType: ImplementationSpecific
        tls:
            - secretName: libreoffice-cert
              hosts:
                - libreoffice.brennoflavio.com.br
    resources:
        requests:
            memory: 512Mi
            cpu: 300m
        limits:
            memory: 2Gi
            cpu: 1000m
imaginary:
    enabled: true
    resources:
        requests:
            memory: 128Mi
            cpu: 100m
        limits:
            memory: 512Mi
            cpu: 400m
phpClientHttpsFix:
    enabled: true
    protocol: https
nginx:
    config:
        headers:
            Strict-Transport-Security: max-age=15768000; includeSubDomains;
