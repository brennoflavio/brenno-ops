apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dav-discovery
  namespace: nextcloud
  annotations:
    kubernetes.io/ingress.class: external-traefik
spec:
  redirectRegex:
    regex: '^https://nextcloud\.brennoflavio\.com\.br/\.well-known/(?:caldav|carddav)(?:\?.*)?$'
    replacement: https://nextcloud.brennoflavio.com.br/remote.php/dav
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hide-server-headers
  namespace: nextcloud
  annotations:
    kubernetes.io/ingress.class: external-traefik
spec:
  headers:
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
