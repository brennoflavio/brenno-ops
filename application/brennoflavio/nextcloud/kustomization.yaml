apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
resources:
  - namespace.yaml
  - redis-pvc.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - mariadb-pvc.yaml
  - nextcloud-pvc.yaml
  - repository.yaml
  - release.yaml
  - preview-service-account.yaml
  - preview-role.yaml
  - preview-role-binding.yaml
  - preview-cron.yaml
configMapGenerator:
  - name: nextcloud-public-values
    files:
      - values.yaml=values.yaml
secretGenerator:
  - name: nextcloud-values
    files:
      - values.yaml=values-encrypted.yaml
configurations:
  - kustomizeconfig.yaml
