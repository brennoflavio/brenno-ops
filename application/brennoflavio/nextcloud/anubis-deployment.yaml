apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-anubis
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-anubis
  template:
    metadata:
      labels:
        app: nextcloud-anubis
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.1
          env:
            - name: BIND
              value: :8923
            - name: TARGET
              value: http://nextcloud:8080
            - name: POLICY_FNAME
              value: /etc/anubis/bot-policy.yaml
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: nextcloud-anubis
                  key: ED25519_PRIVATE_KEY_HEX
            - name: REDIRECT_DOMAINS
              value: nextcloud.brennoflavio.com.br
            - name: SERVE_ROBOTS_TXT
              value: "true"
          ports:
            - name: anubis
              containerPort: 8923
            - name: anubis-metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: anubis-metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: anubis-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: anubis-policy
              mountPath: /etc/anubis
              readOnly: true
            - name: anubis-data
              mountPath: /data
      volumes:
        - name: anubis-policy
          configMap:
            name: nextcloud-anubis
        - name: anubis-data
          emptyDir: {}
