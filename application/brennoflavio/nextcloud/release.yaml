apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  releaseName: nextcloud
  chart:
    spec:
      chart: nextcloud
      version: 8.9.1
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
  interval: 30m
  install:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: nextcloud
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud
              spec:
                template:
                  spec:
                    containers:
                      - name: nextcloud-cron
                        resources:
                          requests:
                            memory: 256Mi
                          limits:
                            memory: 256Mi
                    initContainers:
                      - name: mariadb-isalive
                        resources:
                          requests:
                            memory: 16Mi
                          limits:
                            memory: 16Mi
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: nextcloud-mariadb
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: nextcloud-mariadb
              spec:
                template:
                  spec:
                    initContainers:
                      - name: preserve-logs-symlinks
                        resources:
                          requests:
                            memory: 2Gi
                          limits:
                            memory: 2Gi
  valuesFrom:
    - kind: ConfigMap
      name: nextcloud-public-values
    - kind: Secret
      name: nextcloud-values
