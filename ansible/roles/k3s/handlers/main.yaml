---
- name: reload inotify sysctl
  ansible.builtin.command: /usr/sbin/sysctl -p /etc/sysctl.d/99-inotify.conf
  become: true

- name: restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
  become: true

- name: reload k3s
  ansible.builtin.systemd:
    name: k3s
    state: reloaded
  become: true