---
- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_installed

- name: Install arm64 emulation
  ansible.builtin.apt:
    update_cache: true
    name:
      - binfmt-support
      - qemu-user-static
    state: present
  become: true

- name: Enable arm64 binfmt
  ansible.builtin.command:
    cmd: update-binfmts --enable qemu-aarch64
  changed_when: false
  become: true

- name: Configure inotify instance limit
  ansible.builtin.copy:
    content: |
      fs.inotify.max_user_instances = 1024
    dest: /etc/sysctl.d/99-inotify.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload inotify sysctl
  become: true

- name: Ensure k3s configuration directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  become: true

- name: Configure k3s
  ansible.builtin.copy:
    src: config.yaml
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  register: k3s_config
  notify: restart k3s
  become: true

- name: Download and install k3s
  ansible.builtin.shell: >-
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_EXEC="{{ k3s_exec_args }}" sh -
  when: not k3s_installed.stat.exists
  become: true

- name: Update k3s service arguments
  ansible.builtin.shell: >-
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_SKIP_DOWNLOAD=true
    INSTALL_K3S_EXEC="{{ k3s_exec_args }}" sh -
  when:
    - k3s_installed.stat.exists
    - k3s_config.changed
  become: true

- name: Apply k3s configuration changes
  ansible.builtin.meta: flush_handlers

- name: Ensure k3s service is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
  become: true

- name: Wait for k3s API after configuration changes
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ansible_default_ipv4.address }}"
    delay: 10
    timeout: 300
  when: k3s_config.changed

- name: Wait for CoreDNS deployment
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl -n kube-system get deployment/coredns
  register: coredns_deployment
  retries: 30
  delay: 10
  until: coredns_deployment.rc == 0
  changed_when: false
  become: true

- name: Check CoreDNS resolver uses the k3s upstream
  ansible.builtin.shell: |
    set -euo pipefail
    container_id=$(/usr/local/bin/k3s crictl ps --name coredns -q | head -n1)
    resolver_path=$(
      /usr/local/bin/k3s crictl inspect "$container_id" |
        awk -F '"' '
          /"destination": "\/etc\/resolv.conf"/ { found = 1 }
          found && /"source":/ { print $4; exit }
        '
    )
    expected=$(awk '/^nameserver / { print $2; exit }' /run/systemd/resolve/resolv.conf)
    actual=$(awk '/^nameserver / { print $2; exit }' "$resolver_path")
    test "$actual" = "$expected"
  args:
    executable: /bin/bash
  register: coredns_resolver
  changed_when: false
  failed_when: false
  become: true

- name: Recreate CoreDNS pods after resolver configuration changes
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl -n kube-system delete pod -l k8s-app=kube-dns --wait=true
  when: k3s_config.changed or coredns_resolver.rc != 0
  become: true

- name: Wait for CoreDNS pods after resolver configuration changes
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl -n kube-system wait --for=condition=Ready pod -l k8s-app=kube-dns --timeout=300s
  when: k3s_config.changed or coredns_resolver.rc != 0
  changed_when: false
  become: true

- name: Wait for k3s to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ansible_default_ipv4.address }}"
    delay: 10
    timeout: 300
  when: not k3s_installed.stat.exists

- name: Ensure kubeconfig has correct permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "{{ k3s_kubeconfig_mode }}"
  become: true

- name: Check k3s service status
  ansible.builtin.systemd:
    name: k3s
  register: k3s_service_status
  become: true

- name: Display k3s service status
  ansible.builtin.debug:
    msg: "K3s service is {{ k3s_service_status.status.ActiveState }}"
