apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: home-private-namespace
  namespace: internal-ingress-nginx
spec:
  endpoints:
    # Prevent the public Pages wildcard from resolving private hostnames.
    - dnsName: home.brennoflavio.com.br
      recordType: TXT
      recordTTL: 300
      targets:
        - "Private DNS namespace"
