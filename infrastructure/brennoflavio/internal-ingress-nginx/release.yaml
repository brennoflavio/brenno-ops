---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: internal-nginx
  namespace: internal-ingress-nginx
spec:
  releaseName: internal-nginx
  chart:
    spec:
      chart: ingress-nginx
      version: 4.15.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: internal-ingress-nginx
  interval: 30m
  install:
    remediation:
      retries: 3
  values:
    controller:
      service:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 192.168.20.15
      config:
        strict-validate-path-type: false
        annotations-risk-level: Critical
        log-format-upstream: >-
          $remote_addr - $remote_user [$time_local] "$request" $status
          $body_bytes_sent "$http_referer" "$http_user_agent"
      ingressClass: internal-nginx
      electionID: internal-nginx-leader
      ingressClassResource:
        name: internal-nginx
        enabled: true
        default: false
        controllerValue: k8s.io/internal-nginx
      allowSnippetAnnotations: true
