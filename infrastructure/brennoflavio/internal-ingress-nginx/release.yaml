---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: internal-nginx
  namespace: internal-ingress-nginx
spec:
  releaseName: internal-nginx
  chart:
    spec:
      chart: traefik
      version: 42.4.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: internal-ingress-nginx
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: internal-traefik
    ingressClass:
      name: internal-traefik
      isDefaultClass: false
    providers:
      kubernetesIngress:
        ingressClass: internal-traefik
        strictPrefixMatching: true
        crossProviderNamespaces:
          - actual
      kubernetesCRD:
        ingressClass: internal-traefik
        safeNaming: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        transport:
          respondingTimeouts:
            # Don't impose a total upload deadline on streamed Harbor layers.
            readTimeout: 0s
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.20.15
    accessLog:
      enabled: true
      format: genericCLF
    deployment:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 1Gi
