apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  releaseName: keda
  chart:
    spec:
      chart: keda
      version: 2.20.1
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: keda
  interval: 30m
  install:
    remediation:
      retries: 3
  values:
    resources:
      operator:
        limits:
          cpu: 1
          memory: 1000Mi
        requests:
          cpu: 100m
          memory: 100Mi
      metricServer:
        limits:
          cpu: 1
          memory: 1000Mi
        requests:
          cpu: 100m
          memory: 100Mi
      webhooks:
        limits:
          cpu: 1
          memory: 1000Mi
        requests:
          cpu: 100m
          memory: 100Mi
