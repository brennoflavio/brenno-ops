provider: cloudflare
cloudflare:
    proxied: false
zoneIdFilters:
    - f87d5fa126960dc50151c0169e63342c
sources:
    - ingress
    - crd
domainFilters:
    - brennoflavio.com.br
registry: txt
txtOwnerId: brennoflavio
txtPrefix: _externaldns
txtEncrypt:
    enabled: true
policy: sync
dryRun: false
resources:
    limits:
        memory: 144Mi
    requests:
        cpu: 10m
        memory: 144Mi
crd:
    create: true
extraArgs:
    managed-record-types: CNAME
    ingress-class: external-nginx
