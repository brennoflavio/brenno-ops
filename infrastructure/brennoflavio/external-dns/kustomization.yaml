apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
configMapGenerator:
  - name: external-dns-public-values
    files:
      - values.yaml=values.yaml
secretGenerator:
  - name: external-dns-values
    files:
      - values.yaml=values-encrypted.yaml
configurations:
  - kustomizeconfig.yaml
