---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: ingress-nginx
    namespace: external-ingress-nginx
spec:
    releaseName: ingress-nginx
    chart:
        spec:
            chart: ingress-nginx
            version: 4.15.1
            sourceRef:
                kind: HelmRepository
                name: ingress-nginx
                namespace: external-ingress-nginx
    interval: 30m
    install:
        remediation:
            retries: 3
    values:
        controller:
            service:
                annotations:
                    metallb.io/loadBalancerIPs: 192.168.20.10
            config:
                strict-validate-path-type: false
                annotations-risk-level: Critical
                log-format-upstream: >-
                    $remote_addr - $remote_user [$time_local] "$request" $status
                    $body_bytes_sent "$http_referer" "$http_user_agent"
            ingressClass: external-nginx
            electionID: external-nginx-leader
            ingressClassResource:
                name: external-nginx
                enabled: true
                default: false
                controllerValue: k8s.io/external-nginx
            allowSnippetAnnotations: true
