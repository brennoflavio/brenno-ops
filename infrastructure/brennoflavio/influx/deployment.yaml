apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: influx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.9-alpine
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - secretRef:
                name: influxdb-init
          env:
            - name: INFLUXD_QUERY_CONCURRENCY
              value: "2"
            - name: INFLUXD_QUERY_QUEUE_SIZE
              value: "10"
            - name: INFLUXD_QUERY_INITIAL_MEMORY_BYTES
              value: "33554432"
            - name: INFLUXD_QUERY_MEMORY_BYTES
              value: "268435456"
            - name: INFLUXD_QUERY_MAX_MEMORY_BYTES
              value: "536870912"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 125m
              memory: 4Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/influxdb2
              subPath: data
            - name: storage
              mountPath: /etc/influxdb2
              subPath: config
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: influxdb
