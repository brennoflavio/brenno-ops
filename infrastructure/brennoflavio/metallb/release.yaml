---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: metallb
    namespace: metallb-system
spec:
    releaseName: metallb
    chart:
        spec:
            chart: metallb
            version: 0.16.1
            sourceRef:
                kind: HelmRepository
                name: metallb
                namespace: metallb-system
    interval: 30m
    install:
        remediation:
            retries: 3
    values:
        frrk8s:
            enabled: false
        controller:
            resources:
                requests:
                    cpu: 50m
                    memory: 64Mi
                limits:
                    cpu: 250m
                    memory: 128Mi
        speaker:
            resources:
                requests:
                    cpu: 50m
                    memory: 64Mi
                limits:
                    cpu: 250m
                    memory: 128Mi
