apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt-dns01
spec:
  acme:
    email: contato@brennoflavio.com.br
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: lets-encrypt-dns01-private-key
    solvers:
      - selector:
          dnsZones:
            - brennoflavio.com.br
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns01-credentials
              key: api-token
