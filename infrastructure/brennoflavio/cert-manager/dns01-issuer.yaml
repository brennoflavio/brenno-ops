apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt-dns01
spec:
  acme:
    email: contato@brennoflavio.com.br
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: lets-encrypt-dns01-private-key
    solvers:
      - selector:
          dnsZones:
            - home.brennoflavio.com.br
        dns01:
          route53:
            region: sa-east-1
            hostedZoneID: Z09602182CS7HUQKW198W
            accessKeyIDSecretRef:
              name: route53-dns01-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-dns01-credentials
              key: secret-access-key
